baseURL = 'https://landonbjackson.dev/'

# Theme Name
theme = 'hugo-bearblog'

# Basic metadata configuration.
title = "Landon B. Jackson"
author = "Landon Jackson"
copyright = "Copyright © 2026, Landon Jackson."

# Generate a nice robots.txt for SEO
enableRobotsTXT = true

# Generate "Bearblog"-like URLs !only!, see https://bearblog.dev/.
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[permalinks]
  blog  = "/blog/:slug/"
  posts = "/posts/:slug/"
  music = "/music/:slug/"
  printer-stream = "/printer-stream/:slug/"
  projects = "/projects/:slug/"
  home = "/home/:slug/"

[params]
    description = "Landon B. Jackson: FPGA / RF engineer specializing in RTL design, DSP, and Xilinx RFSoC systems."
    email = "landonbjackson@gmail.com"
    github = "https://github.com/Beauxrel"
    # linkedin = "https://www.linkedin.com/in/your-handle/"
    # Drop a PDF at static/resume.pdf and uncomment to show a download button.
    # resume = "/resume.pdf"
    favicon = "images/favicon.png"
    images = ["images/share.png"]
    # Hide Footer
    hideMadeWithLine = true

# Allows me to use HTML in Markdown WOAH!!!!
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
