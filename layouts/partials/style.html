<style>
  :root {
    --bg: #0a0f1a;
    --bg-2: #0f1626;
    --surface: #121b2e;
    --surface-2: #17223a;
    --border: #22304d;
    --text: #d7deea;
    --muted: #8a97ad;
    --heading: #f3f6fb;
    --accent: #38e1c6;
    --accent-2: #7aa2ff;
    --accent-ink: #04211c;
    --grid: rgba(122, 162, 255, 0.05);
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    --radius: 14px;
    --wrap: 1080px;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fb;
      --bg-2: #eef2f8;
      --surface: #ffffff;
      --surface-2: #f2f5fa;
      --border: #dde3ee;
      --text: #2a3446;
      --muted: #637089;
      --heading: #0b1220;
      --accent: #0d9c86;
      --accent-2: #3b5bdb;
      --accent-ink: #ffffff;
      --grid: rgba(59, 91, 219, 0.05);
      --shadow: 0 10px 30px rgba(20, 30, 60, 0.08);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.65;
    color: var(--text);
    background: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  h1, h2, h3, h4 { color: var(--heading); line-height: 1.2; margin: 0 0 .5em; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  img { max-width: 100%; height: auto; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }
  .wrap.narrow { max-width: 780px; }
  .skip { position: absolute; left: -999px; }
  .skip:focus { left: 16px; top: 16px; z-index: 100; background: var(--surface); padding: 8px 12px; }

  /* Header */
  .site-header {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(12px);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .header-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--heading); font-weight: 700; }
  .brand:hover { text-decoration: none; }
  .brand-mark {
    display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px;
    font-family: var(--mono); font-size: 13px; color: var(--accent-ink);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .site-nav { display: flex; align-items: center; gap: 4px; }
  .site-nav a { color: var(--muted); font-size: 15px; font-weight: 500; padding: 8px 12px; border-radius: 8px; }
  .site-nav a:hover, .site-nav a[aria-current] { color: var(--heading); background: var(--surface); text-decoration: none; }
  .site-nav a.btn { color: var(--accent-ink); margin-left: 8px; }
  .nav-toggle { display: none; background: none; border: 0; padding: 8px; cursor: pointer; }
  .nav-toggle span { display: block; width: 22px; height: 2px; background: var(--heading); margin: 5px 0; }

  @media (max-width: 760px) {
    .nav-toggle { display: block; }
    .site-nav {
      display: none; position: absolute; top: 64px; left: 0; right: 0; flex-direction: column; align-items: stretch;
      padding: 12px 16px 16px; background: var(--bg); border-bottom: 1px solid var(--border);
    }
    .site-nav.open { display: flex; }
    .site-nav a.btn { margin: 8px 0 0; text-align: center; }
    .brand-name { font-size: 15px; }
  }

  /* Buttons & chips */
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px;
    font-weight: 600; font-size: 15px; color: var(--accent-ink); background: var(--accent);
    border: 1px solid var(--accent); transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { text-decoration: none; transform: translateY(-1px); box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 35%, transparent); }
  .btn-ghost { background: transparent; color: var(--heading); border-color: var(--border); }
  .btn-ghost:hover { border-color: var(--accent); box-shadow: none; }
  .btn-sm { padding: 7px 14px !important; font-size: 14px !important; background: var(--accent); }
  .chips { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips li {
    font-family: var(--mono); font-size: 12.5px; padding: 4px 10px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
  }

  /* Hero */
  .hero { position: relative; padding: 96px 0 72px; overflow: hidden; border-bottom: 1px solid var(--border); }
  .hero::before {
    content: ""; position: absolute; inset: -40% -10% auto auto; width: 720px; height: 720px; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent-2) 22%, transparent), transparent 65%);
    pointer-events: none;
  }
  .hero-wave { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hero-inner { position: relative; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--accent);
    padding: 6px 12px; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 999px; margin: 0 0 24px; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .hero-name { font-size: clamp(2.4rem, 6vw, 4.2rem); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; }
  .hero-name .cred { color: var(--muted); font-weight: 600; font-size: .5em; letter-spacing: 0; }
  .hero-role {
    font-size: clamp(1.25rem, 2.6vw, 1.75rem); font-weight: 600; margin: 0 0 16px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero-tags { list-style: none; padding: 0; margin: 0 0 24px; display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 15px; }
  .hero-tags li::before { content: "▸ "; color: var(--accent); }
  .hero-summary { max-width: 680px; font-size: 1.08rem; margin: 0 0 32px; }
  .hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; max-width: 640px; margin: 56px 0 0; }
  .stats div { padding: 16px 18px; background: color-mix(in srgb, var(--surface) 80%, transparent); border: 1px solid var(--border); border-radius: var(--radius); }
  .stats dt { font-size: 13px; color: var(--muted); }
  .stats dd { margin: 4px 0 0; font-size: 1.5rem; font-weight: 700; color: var(--heading); }
  @media (max-width: 560px) { .hero { padding: 64px 0 48px; } .stats { grid-template-columns: 1fr; } .stats dd { font-size: 1.25rem; } }

  /* Sections */
  .section { padding: 80px 0; }
  .section.tight { padding-top: 0; }
  .section + .section { border-top: 1px solid var(--border); }
  .section.tight, .page-head + .section { border-top: 0; }
  .page-head { padding-bottom: 32px; }
  .section-title { display: flex; align-items: baseline; gap: 14px; font-size: clamp(1.6rem, 3vw, 2.1rem); letter-spacing: -0.02em; margin-bottom: 36px; }
  .section-title .mono { font-size: 14px; color: var(--accent); }
  .section-title.small { font-size: 1.25rem; margin: 40px 0 8px; }
  .page-title { font-size: clamp(2rem, 4.5vw, 2.8rem); letter-spacing: -0.02em; }

  /* Experience timeline */
  .company { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); }
  .company-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .company-head h3 { font-size: 1.5rem; margin: 0; }
  .timeline { list-style: none; margin: 0; padding: 0 0 0 24px; border-left: 2px solid var(--border); }
  .timeline > li { position: relative; padding-bottom: 28px; }
  .timeline > li:last-child { padding-bottom: 0; }
  .timeline > li::before {
    content: ""; position: absolute; left: -32px; top: 6px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--accent);
  }
  .timeline > li:first-child::before { background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .role-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; }
  .role-head h4 { font-size: 1.1rem; margin: 0; }
  .role-head .mono { font-size: 13px; }
  .bullets { margin: 10px 0 0; padding-left: 18px; }
  .bullets li { margin: 4px 0; }
  .bullets li::marker { color: var(--accent); }
  @media (max-width: 560px) { .company { padding: 20px; } }

  /* Cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  @media (max-width: 400px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    display: flex; flex-direction: column; transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); box-shadow: var(--shadow); }
  .card-link { color: inherit; display: flex; flex-direction: column; height: 100%; }
  .card-link:hover { text-decoration: none; }
  .card-img { aspect-ratio: 16 / 9; overflow: hidden; background: var(--bg-2); border-bottom: 1px solid var(--border); }
  .card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
  .card:hover .card-img img { transform: scale(1.04); }
  .card-body { padding: 20px 22px 22px; display: flex; flex-direction: column; flex: 1; }
  .card-body h3 { font-size: 1.15rem; margin: 0 0 8px; }
  .card-body p { margin: 0; font-size: 15px; }
  .card-date { font-size: 12.5px !important; margin-bottom: 6px !important; }
  .card-more { margin-top: auto; padding-top: 16px; color: var(--accent); font-weight: 600; font-size: 14px; }

  /* Skills */
  .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
  .skill-group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
  .skill-group h3 { font-size: 14px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin: 0; }

  /* Education */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; gap: 16px; } }
  .edu { padding: 18px 0; border-bottom: 1px dashed var(--border); }
  .edu h3 { font-size: 1.1rem; margin: 0 0 4px; }
  .edu p { margin: 0; }
  .edu .mono { font-size: 13px; margin-top: 4px; }

  /* Contact */
  .contact { text-align: center; }
  .contact-inner {
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--surface)), color-mix(in srgb, var(--accent-2) 14%, var(--surface)));
    border: 1px solid var(--border); border-radius: 20px; padding: 56px 24px; max-width: 860px;
  }
  .contact-inner h2 { font-size: clamp(1.6rem, 3.5vw, 2.3rem); }
  .contact-inner p { max-width: 520px; margin: 0 auto 28px; }
  .contact .hero-cta { justify-content: center; }
  .contact .btn { word-break: break-all; }

  /* Posts & prose */
  .post-list { list-style: none; padding: 0; margin: 0; }
  .post-list li { display: flex; gap: 24px; padding: 16px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
  .post-list time { flex: 0 0 120px; font-size: 13px; }
  .post-list a { font-weight: 600; font-size: 1.05rem; }
  @media (max-width: 560px) { .post-list li { flex-direction: column; gap: 2px; } .post-list time { flex: none; } }
  .back { display: inline-block; font-size: 14px; margin-bottom: 24px; }
  .post-head { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
  .post-head .mono { font-size: 14px; margin: 0; }
  .prose { font-size: 1.04rem; }
  .prose h1 { font-size: 1.8rem; margin-top: 2em; }
  .prose h2 { font-size: 1.45rem; margin-top: 1.8em; }
  .prose h3 { font-size: 1.2rem; margin-top: 1.6em; }
  .prose > :first-child { margin-top: 0; }
  .prose img { display: block; border-radius: 10px; border: 1px solid var(--border); margin: 1.5em auto; background: #fff; }
  .prose li::marker { color: var(--accent); }
  .prose blockquote { margin: 1.5em 0; padding: 4px 20px; border-left: 3px solid var(--accent); color: var(--muted); background: var(--surface); border-radius: 0 8px 8px 0; }
  .prose code { font-family: var(--mono); font-size: .88em; padding: 2px 6px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--border); }
  .prose pre, .prose .highlight pre {
    font-family: var(--mono); font-size: .85rem; line-height: 1.55; padding: 18px; border-radius: 10px;
    overflow-x: auto; background: #070b14 !important; border: 1px solid var(--border); max-width: 100%;
  }
  .prose pre code { background: none; border: 0; padding: 0; font-size: inherit; }
  .prose table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
  .prose th, .prose td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; }
  .prose hr { border: 0; border-top: 1px solid var(--border); margin: 2.5em 0; }

  /* Footer */
  .site-footer { border-top: 1px solid var(--border); padding: 28px 0; font-size: 14px; color: var(--muted); }
  .footer-inner { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .footer-links { display: flex; gap: 18px; }
  .footer-links a { color: var(--muted); }
  .footer-links a:hover { color: var(--accent); }

  /* Reveal on scroll */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .reveal { opacity: 1; transform: none; transition: none; }
    .pulse { animation: none; }
  }

  /* Stream page */
  .page-stream .video-js { position: relative; border-radius: 12px; overflow: hidden; }
  .page-stream .video-js .vjs-big-play-button { top: 50%; left: 50%; transform: translate(-50%, -50%); }
</style>
